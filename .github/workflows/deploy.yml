name: deploy-book

# Zgradi knjigo z Jupyter Book 2 (MyST) in jo objavi na GitHub Pages.
# Privzeto se beležnice NE izvajajo: knjiga se zgradi iz izhodov, shranjenih v
# repozitoriju (< 1 min). Ročni zagon (workflow_dispatch) z "execute: true"
# ponovno izvede vse beležnice (~10 min) - uporabi za preverjanje, da vsa koda teče.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      execute:
        description: 'Ponovno izvedi vse beležnice'
        type: boolean
        default: false

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Jupyter Book
        run: pip install "jupyter-book>=2.1" pyyaml

      - name: Install Python dependencies (execution only)
        if: ${{ inputs.execute }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 xvfb
          pip install -r requirements.txt jupyter-server ipykernel

      - name: Build the book
        if: ${{ !inputs.execute }}
        run: jupyter book build --html

      - name: Build the book (executing all notebooks)
        if: ${{ inputs.execute }}
        run: xvfb-run -a jupyter book build --html --execute

      - name: Redirects for old (Sphinx) URLs
        run: python .github/redirects.py _build/html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
